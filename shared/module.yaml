product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //base.module-template.yaml

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.compose.material3.adaptive
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.appstate.transform

  # Navigation 3
  - $libs.androidx.navigation3.runtime
  - $libs.jetbrains.navigation3.ui
  - $libs.androidx.lifecycle.viewmodel.navigation3

  # Koin
  - $libs.koin.core
  - $libs.koin.annotations
  - $libs.koin.compose.viewmodel

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.techullurgy.dosthman.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization: enabled
#    compilerPlugins:
#      - id: io.insert-koin.compiler.plugin
#        dependency: $libs.koin.compiler.plugin
